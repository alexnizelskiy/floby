<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет соединения — floby</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f6f8f6;
        color: #14201a;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        border-radius: 20px;
        display: block;
      }
      h1 { font-size: 1.5rem; margin: 0 0 12px; }
      p { margin: 0 0 24px; color: #4b5a52; line-height: 1.5; }
      button {
        border: 0;
        background: #23b059;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        padding: 14px 28px;
        border-radius: 999px;
        cursor: pointer;
      }
      button:active { background: #1a9a4c; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="mark" src="/icon-192.png" alt="floby" />
      <h1>Нет соединения с интернетом</h1>
      <p>
        Похоже, пропала сеть. Проверьте подключение — и мы снова на связи.
        Заказать уборку можно будет сразу, как только интернет вернётся.
      </p>
      <button onclick="location.reload()">Попробовать снова</button>
    </div>
  </body>
</html>
